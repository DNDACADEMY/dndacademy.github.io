<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc" font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><title id="title">Orca 원격 사용, 실행 위치부터 구분하기</title><desc id="desc">위쪽은 노트북 Orca가 SSH 호스트의 코드와 에이전트를 관리한다. 아래쪽은 여러 클라이언트가 Tailscale을 통해 원격 Orca 런타임에 접속한다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#6ee7c5"/></marker></defs><rect x="0" y="0" width="1200" height="760" rx="0" fill="#0b1423" stroke="#0b1423"/><text x="48" y="48" fill="#6ee7c5" font-size="16" font-weight="700">DND  /  ENGINEERING FIELD NOTES</text><text x="48" y="102" fill="#f4f7fc" font-size="35" font-weight="700">Orca 원격 사용, 실행 위치부터 구분하기</text><text x="48" y="142" fill="#9eb0c9" font-size="21" font-weight="400">화면이 있는 곳과 실제 작업이 실행되는 곳은 다를 수 있습니다.</text><rect x="48" y="178" width="1104" height="214" rx="20" fill="#16243a" stroke="#31435e"/><text x="72" y="216" fill="#9fbaff" font-size="18" font-weight="700">01  SSH WORKTREE</text><rect x="72" y="238" width="342" height="120" rx="20" fill="#1c2c45" stroke="#31435e"/><text x="94" y="276" fill="#dce6f4" font-size="25" font-weight="700">내 노트북 · Orca</text><text x="94" y="312" fill="#aebed4" font-size="19" font-weight="400">전체 런타임 / 에디터 / diff</text><path d="M438 294 L716 294" fill="none" stroke="#6ee7c5" stroke-width="3" marker-end="url(#arrow)"/><text x="499" y="275" fill="#6ee7c5" font-size="19" font-weight="700">SSH</text><rect x="742" y="238" width="386" height="120" rx="20" fill="#1c2c45" stroke="#31435e"/><text x="764" y="276" fill="#dce6f4" font-size="25" font-weight="700">원격 개발 장비</text><text x="764" y="312" fill="#aebed4" font-size="19" font-weight="400">코드 / Git / 에이전트 / PTY</text><rect x="48" y="416" width="1104" height="256" rx="20" fill="#16243a" stroke="#31435e"/><text x="72" y="454" fill="#6ee7c5" font-size="18" font-weight="700">02  REMOTE ORCA SERVER</text><rect x="72" y="476" width="342" height="150" rx="20" fill="#1c2c45" stroke="#31435e"/><text x="94" y="515" fill="#dce6f4" font-size="25" font-weight="700">접속 기기</text><text x="94" y="550" fill="#aebed4" font-size="19" font-weight="400">노트북 앱 / 모바일 / CLI</text><text x="94" y="583" fill="#aebed4" font-size="19" font-weight="400">화면 표시와 입력 전송</text><path d="M438 552 L716 552" fill="none" stroke="#6ee7c5" stroke-width="3" marker-end="url(#arrow)"/><text x="486" y="517" fill="#6ee7c5" font-size="18" font-weight="700">TAILSCALE</text><text x="479" y="588" fill="#aebed4" font-size="18" font-weight="400">+ Orca 페어링</text><rect x="742" y="476" width="386" height="150" rx="20" fill="#163c3d" stroke="#397970"/><text x="764" y="515" fill="#dce6f4" font-size="25" font-weight="700">켜져 있는 원격 컴퓨터</text><text x="764" y="550" fill="#6ee7c5" font-size="20" font-weight="700">Orca 전체 런타임</text><text x="764" y="583" fill="#aebed4" font-size="19" font-weight="400">코드 / 터미널 / 에이전트 / 상태</text><text x="48" y="715" fill="#9eb0c9" font-size="18" font-weight="400">개념도 · 실제 앱 화면 아님  |  서버의 전원·절전·프로세스 상태는 별도 관리</text></svg>
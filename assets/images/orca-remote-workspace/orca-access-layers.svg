<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc" font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><title id="title">원격 제어는 세 층이 모두 준비되어야 합니다</title><desc id="desc">Tailscale 네트워크 도달성, Orca 클라이언트 인증, 서버의 실행 환경은 서로 다른 역할이다. Tailscale만 설치해도 서비스가 생기지는 않는다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#6ee7c5"/></marker></defs><rect x="0" y="0" width="1200" height="760" rx="0" fill="#0b1423" stroke="#0b1423"/><text x="48" y="48" fill="#6ee7c5" font-size="16" font-weight="700">DND  /  ENGINEERING FIELD NOTES</text><text x="48" y="102" fill="#f4f7fc" font-size="35" font-weight="700">원격 제어는 세 층이 모두 준비되어야 합니다</text><text x="48" y="142" fill="#9eb0c9" font-size="21" font-weight="400">Tailscale 설치 = Orca 서버 실행 = 에이전트 인증, 이 세 가지는 같지 않습니다.</text><rect x="48" y="180" width="1104" height="136" rx="20" fill="#16243a" stroke="#31435e"/><rect x="72" y="204" width="56" height="56" rx="14" fill="#22354c" stroke="#31435e"/><text x="84" y="241" fill="#9fbaff" font-size="23" font-weight="700">01</text><text x="154" y="218" fill="#9fbaff" font-size="14" font-weight="700">NETWORK</text><text x="154" y="258" fill="#dce6f4" font-size="28" font-weight="700">Tailscale</text><text x="480" y="234" fill="#dce6f4" font-size="23" font-weight="600">어느 기기에서 어느 서비스에 도달할 수 있나?</text><text x="480" y="274" fill="#aebed4" font-size="19" font-weight="400">기기 연결 · 주소 / MagicDNS · grants / ACL</text><rect x="48" y="338" width="1104" height="136" rx="20" fill="#16243a" stroke="#31435e"/><rect x="72" y="362" width="56" height="56" rx="14" fill="#22354c" stroke="#31435e"/><text x="84" y="399" fill="#6ee7c5" font-size="23" font-weight="700">02</text><text x="154" y="376" fill="#6ee7c5" font-size="14" font-weight="700">ACCESS</text><text x="154" y="416" fill="#dce6f4" font-size="28" font-weight="700">Orca 페어링</text><text x="480" y="392" fill="#dce6f4" font-size="23" font-weight="600">이 클라이언트가 런타임을 제어해도 되는가?</text><text x="480" y="432" fill="#aebed4" font-size="19" font-weight="400">접속 링크 · 클라이언트별 토큰 · 권한 철회</text><rect x="48" y="496" width="1104" height="136" rx="20" fill="#16243a" stroke="#31435e"/><rect x="72" y="520" width="56" height="56" rx="14" fill="#22354c" stroke="#31435e"/><text x="84" y="557" fill="#f4ce88" font-size="23" font-weight="700">03</text><text x="154" y="534" fill="#f4ce88" font-size="14" font-weight="700">EXECUTION</text><text x="154" y="574" fill="#dce6f4" font-size="28" font-weight="700">서버의 작업 환경</text><text x="480" y="550" fill="#dce6f4" font-size="23" font-weight="600">실제로 실행할 코드와 도구가 준비되었는가?</text><text x="480" y="590" fill="#aebed4" font-size="19" font-weight="400">깨어 있는 호스트 · Orca · Git · 에이전트 인증</text><rect x="48" y="674" width="1104" height="46" rx="12" fill="#132c31" stroke="#2d5e59"/><text x="70" y="704" fill="#6ee7c5" font-size="20" font-weight="400">네트워크가 통해도 서비스가 꺼져 있거나 인증이 맞지 않으면 연결할 수 없습니다.</text></svg>
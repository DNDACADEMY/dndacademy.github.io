<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc" font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><title id="title">원격 CLI 제어: 읽고, 확인하고, 한 번 보내기</title><desc id="desc">원격 환경과 서버 경로를 선택한 후 터미널 출력을 읽고 입력 대기를 확인한다. 전송 receipt와 실제 테스트 결과를 구분한다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#6ee7c5"/></marker></defs><rect x="0" y="0" width="1200" height="800" rx="0" fill="#0b1423" stroke="#0b1423"/><text x="48" y="48" fill="#6ee7c5" font-size="16" font-weight="700">DND  /  ENGINEERING FIELD NOTES</text><text x="48" y="102" fill="#f4f7fc" font-size="35" font-weight="700">원격 CLI 제어: 읽고, 확인하고, 한 번 보내기</text><text x="48" y="142" fill="#9eb0c9" font-size="21" font-weight="400">명령을 보낸 사실과 작업이 성공한 사실을 구분합니다.</text><rect x="48" y="188" width="520" height="172" rx="20" fill="#16243a" stroke="#31435e"/><text x="72" y="224" fill="#6ee7c5" font-size="15" font-weight="700">STEP 1</text><text x="72" y="265" fill="#dce6f4" font-size="28" font-weight="700">대상 고르기</text><text x="72" y="300" fill="#b5c9e6" font-size="20" font-weight="400">environment → repo</text><text x="72" y="333" fill="#9eb0c9" font-size="19" font-weight="400">서버 경로 → terminal handle</text><rect x="632" y="188" width="520" height="172" rx="20" fill="#16243a" stroke="#31435e"/><text x="656" y="224" fill="#6ee7c5" font-size="15" font-weight="700">STEP 2</text><text x="656" y="265" fill="#dce6f4" font-size="28" font-weight="700">출력 먼저 읽기</text><text x="656" y="300" fill="#b5c9e6" font-size="20" font-weight="400">terminal read</text><text x="656" y="333" fill="#9eb0c9" font-size="19" font-weight="400">셸인가? 에이전트인가?</text><rect x="48" y="398" width="520" height="172" rx="20" fill="#16243a" stroke="#31435e"/><text x="72" y="434" fill="#6ee7c5" font-size="15" font-weight="700">STEP 3</text><text x="72" y="475" fill="#dce6f4" font-size="28" font-weight="700">입력 준비 확인</text><text x="72" y="510" fill="#b5c9e6" font-size="20" font-weight="400">terminal wait: tui-idle</text><text x="72" y="543" fill="#9eb0c9" font-size="19" font-weight="400">wait.satisfied + 대기 화면</text><rect x="632" y="398" width="520" height="172" rx="20" fill="#16243a" stroke="#31435e"/><text x="656" y="434" fill="#6ee7c5" font-size="15" font-weight="700">STEP 4</text><text x="656" y="475" fill="#dce6f4" font-size="28" font-weight="700">한 번 보내고 관찰</text><text x="656" y="510" fill="#b5c9e6" font-size="20" font-weight="400">terminal send → read</text><text x="656" y="543" fill="#9eb0c9" font-size="19" font-weight="400">수락 / 턴 시작 / 완료는 별개</text><path d="M580 272 L618 272" fill="none" stroke="#6ee7c5" stroke-width="3" marker-end="url(#arrow)"/><path d="M580 484 L618 484" fill="none" stroke="#6ee7c5" stroke-width="3" marker-end="url(#arrow)"/><path d="M892 366 L892 378 L308 378 L308 386" fill="none" stroke="#6ee7c5" stroke-width="2" marker-end="url(#arrow)"/><rect x="48" y="616" width="1104" height="104" rx="20" fill="#302b23" stroke="#695a3b"/><text x="72" y="653" fill="#f4ce88" font-size="23" font-weight="700">검증은 별도 단계</text><text x="72" y="690" fill="#e2cfaa" font-size="20" font-weight="400">테스트 결과 · 종료 코드 · 실제 diff 확인  /  지연만으로 프롬프트를 재전송하지 않기</text><text x="48" y="762" fill="#9eb0c9" font-size="18" font-weight="400">개념도 · 명령 구문은 설치된 Orca 버전의 도움말과 번들 스킬로 확인</text></svg>
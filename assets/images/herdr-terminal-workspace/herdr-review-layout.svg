<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
  <defs><style>
    .bg{fill:#1e1e2e}.mantle{fill:#181825}.crust{fill:#11111b}.surf{fill:#313244}
    .border{stroke:#45475a;stroke-width:1.5;fill:none}.focus{stroke:#cba6f7;stroke-width:2.5;fill:none}
    .t{fill:#cdd6f4;font-size:13px}.d{fill:#9399b2;font-size:12px}
    .grn{fill:#a6e3a1;font-size:12px}.tl{fill:#94e2d5;font-size:12px}.blu{fill:#89b4fa;font-size:12px}
    .add{fill:#a6e3a1;font-size:12px}.del{fill:#f38ba8;font-size:12px}
    .flow{stroke:#cba6f7;stroke-width:2;fill:none;marker-end:url(#a)}
    .fl{fill:#cba6f7;font-size:12px;font-weight:700}
  </style>
  <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#cba6f7"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="880" height="520" rx="10"/>
  <rect class="crust" x="20" y="20" width="700" height="28" rx="8"/>
  <circle cx="40" cy="34" r="5" fill="#f38ba8"/><circle cx="58" cy="34" r="5" fill="#f9e2af"/><circle cx="76" cy="34" r="5" fill="#a6e3a1"/>
  <text class="d" x="110" y="38">herdr  ·  리뷰 워크플로우 레이아웃</text>

  <!-- top-left: claude -->
  <rect class="mantle" x="20" y="56" width="360" height="210"/>
  <rect class="focus" x="21" y="57" width="358" height="208"/>
  <text class="d" x="34" y="78">p1</text><text class="grn" x="300" y="78">● working</text>
  <text class="t" x="34" y="102">❯ claude</text>
  <text class="d" x="34" y="124">· 글 초안 작성 완료</text>
  <text class="d" x="34" y="144">· herdr pane split --direction right</text>
  <text class="d" x="34" y="164">· herdr agent start reviewer --kind codex</text>
  <text class="d" x="34" y="184">· herdr agent prompt reviewer "리뷰해줘"</text>
  <text class="d" x="34" y="212">⠹ 리뷰 대기 중</text>

  <!-- bottom-left: helix -->
  <rect class="mantle" x="20" y="266" width="360" height="230"/>
  <rect class="border" x="21" y="267" width="358" height="228"/>
  <text class="d" x="34" y="288">p3</text><text class="blu" x="330" y="288">idle</text>
  <text class="t" x="34" y="312">❯ hx _posts/2026-08-27-herdr….md</text>
  <text class="del" x="34" y="336">- 37 │ 맥이 잠들어도 계속 작업</text>
  <text class="add" x="34" y="356">+ 37 │ detach·네트워크 단절에는 유지</text>
  <text class="d" x="34" y="380">  38 │ ]g 로 다음 변경 지점 이동</text>
  <text class="d" x="34" y="470">NOR   _posts/…md   37:9   utf-8</text>

  <!-- right: codex reviewer -->
  <rect class="mantle" x="380" y="56" width="340" height="440"/>
  <rect class="border" x="381" y="57" width="338" height="438"/>
  <text class="d" x="394" y="78">p2</text><text class="tl" x="650" y="78">done</text>
  <text class="t" x="394" y="102">❯ codex  (reviewer)</text>
  <text class="d" x="394" y="128">리뷰 결과 — 실행 가능한 지적</text>
  <text class="del" x="394" y="152">• :37 "sleep에도 유지"는 과장</text>
  <text class="del" x="394" y="172">• :76 prefix+? 표기로 통일</text>
  <text class="del" x="394" y="192">• :82 "권한 자동 처리" 삭제</text>
  <text class="del" x="394" y="212">• :107 --wait = blocked에서도 반환</text>
  <text class="del" x="394" y="232">• :169 Lazygit Enter 설명 수정</text>
  <text class="del" x="394" y="252">• :175 delta는 lazygit 설정 별도</text>
  <text class="d" x="394" y="284">→ herdr agent read reviewer \</text>
  <text class="d" x="394" y="304">    --source recent-unwrapped</text>

  <!-- flow arrows -->
  <path class="flow" d="M300 150 L392 150"/>
  <text class="fl" x="300" y="140">① 리뷰 요청</text>
  <path class="flow" d="M392 320 Q 300 360 300 340"/>
  <text class="fl" x="250" y="378">② 지적 반영</text>
  <path class="flow" d="M120 266 L120 240"/>
</svg>
